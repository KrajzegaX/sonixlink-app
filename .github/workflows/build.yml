name: Build Debug APK

on:
  push:
    branches: [ "build-apk" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Ensure gradlew exists
        run: |
          if [ ! -f "gradlew" ]; then
            echo "Brak gradlew, generowanie przez systemowy Gradle..."
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sonixlink-1.2.1
          path: "**/build/outputs/apk/debug/*.apk"
